name: Deploy Stage

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deployment-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          API_BASE_URL: ${{ secrets.STAGE_API_BASE_URL }}
          NEXT_PUBLIC_NAVER_MAP_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_NAVER_MAP_CLIENT_ID }}
          NEXT_PUBLIC_KAKAO_JS_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_JS_KEY }}

      - name: Transfer files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".nvmrc,.next/,public/,package.json,pnpm-lock.yaml,pnpm-workspace.yaml,next.config.ts,ecosystem.config.js"
          target: "~/LOCAL_BALANCE_TRIP_FRONT_STAGE"
          overwrite: true

      - name: Restart server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cat > ~/LOCAL_BALANCE_TRIP_FRONT_STAGE/.env <<'ENVEOF'
            API_BASE_URL=${{ secrets.STAGE_API_BASE_URL }}
            NEXT_PUBLIC_NAVER_MAP_CLIENT_ID=${{ secrets.NEXT_PUBLIC_NAVER_MAP_CLIENT_ID }}
            NEXT_PUBLIC_KAKAO_JS_KEY=${{ secrets.NEXT_PUBLIC_KAKAO_JS_KEY }}
            ENVEOF
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"
            cd ~/LOCAL_BALANCE_TRIP_FRONT_STAGE
            if [ "$(nvm current)" = "v$(cat .nvmrc)" ]; then
              nvm install
            else
              nvm install --reinstall-packages-from=current
            fi
            nvm use
            nvm alias default "$(cat .nvmrc)"
            node --version
            if ! command -v pnpm >/dev/null || [ "$(pnpm --version)" != "10.33.0" ]; then
              npm install --global pnpm@10.33.0
            fi
            if ! command -v pm2 >/dev/null; then
              npm install --global pm2
            fi
            CI=true pnpm install --prod --frozen-lockfile --config.minimumReleaseAge=0
            DEPLOY_APP_NAME=nextjs-stage PORT=3001 pm2 startOrReload ecosystem.config.js --update-env
            curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 10 --output /dev/null http://127.0.0.1:3001/ko/login
            pm2 save
            pm2 jlist | node -e '
              const fs = require("node:fs");
              const apps = JSON.parse(fs.readFileSync(0, "utf8"));
              const app = apps.find((app) => app.name === "nextjs-stage");
              if (!app || app.pm2_env.status !== "online" || app.pm2_env.node_version !== process.versions.node) {
                throw new Error("PM2 app is not online on the configured Node.js version");
              }
              console.log(app.name + ": Node.js " + app.pm2_env.node_version + " (online)");
            '

      - name: Check public response
        run: curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 --max-time 15 --output /dev/null https://stage.lb-trip.live/ko/login
