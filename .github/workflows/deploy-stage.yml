name: Deploy Stage

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          API_BASE_URL: ${{ secrets.STAGE_API_BASE_URL }}
          NEXT_PUBLIC_NAVER_MAP_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_NAVER_MAP_CLIENT_ID }}
          NEXT_PUBLIC_KAKAO_JS_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_JS_KEY }}

      - name: Transfer files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".nvmrc,.next/,public/,package.json,pnpm-lock.yaml,pnpm-workspace.yaml,next.config.ts"
          target: "~/LOCAL_BALANCE_TRIP_FRONT_STAGE"
          overwrite: true

      - name: Restart server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cat > ~/LOCAL_BALANCE_TRIP_FRONT_STAGE/.env <<'ENVEOF'
            API_BASE_URL=${{ secrets.STAGE_API_BASE_URL }}
            NEXT_PUBLIC_NAVER_MAP_CLIENT_ID=${{ secrets.NEXT_PUBLIC_NAVER_MAP_CLIENT_ID }}
            NEXT_PUBLIC_KAKAO_JS_KEY=${{ secrets.NEXT_PUBLIC_KAKAO_JS_KEY }}
            ENVEOF
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"
            cd ~/LOCAL_BALANCE_TRIP_FRONT_STAGE
            if [ "$(nvm current)" = "v$(cat .nvmrc)" ]; then
              nvm install
            else
              nvm install --reinstall-packages-from=current
            fi
            nvm use
            nvm alias default "$(cat .nvmrc)"
            node --version
            npm install --global pnpm@10.33.0 pm2
            pnpm install --prod --config.minimumReleaseAge=0
            pm2 reload nextjs-stage --update-env --interpreter "$(command -v node)"
            pm2 update
            pm2 save
            pm2 jlist | node -e '
              const fs = require("node:fs");
              const apps = JSON.parse(fs.readFileSync(0, "utf8"));
              const app = apps.find((app) => app.name === "nextjs-stage");
              if (!app || app.pm2_env.status !== "online" || app.pm2_env.node_version !== process.versions.node) {
                throw new Error("PM2 app is not online on the configured Node.js version");
              }
              console.log(app.name + ": Node.js " + app.pm2_env.node_version + " (online)");
            '
