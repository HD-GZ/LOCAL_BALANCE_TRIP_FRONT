name: 작업
description: 신규 기능, UI 구현, API 연결, 리팩토링 등 일반 작업
title: "[작업] "
labels: []
body:
  - type: dropdown
    id: task-type
    attributes:
      label: 작업 유형
      options:
        - 신규 기능
        - UI 구현
        - API 연결
        - 리팩토링
        - 기타
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 작업 내용
      description: 무엇을 구현하거나 변경하는지 설명해주세요.
      placeholder: 예) 로그인 폼 컴포넌트 구현 및 react-hook-form 연동
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: 요구사항
      description: 완료 기준이나 세부 요구사항을 작성해주세요.
      placeholder: |
        - [ ] 요구사항 1
        - [ ] 요구사항 2
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 관련 디자인, 문서, 이슈 링크 등을 첨부해주세요. (선택)
      placeholder: Figma 링크, 관련 이슈 번호 등
