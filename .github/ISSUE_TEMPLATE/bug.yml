name: 버그 수정
description: 버그 또는 예상치 못한 동작 보고
title: "[버그] "
labels: ["🐞 BugFix"]
body:
  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 어떤 문제가 발생했는지 간단히 설명해주세요.
      placeholder: 예) 로그인 버튼 클릭 시 에러 없이 아무 반응이 없음
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1. '...' 페이지에서
        2. '...' 버튼 클릭
        3. 에러 발생
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      placeholder: 정상적으로라면 어떻게 동작해야 하는지 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      placeholder: 실제로 어떤 동작이 발생했는지 작성해주세요. 스크린샷이나 에러 로그를 첨부하면 좋습니다.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 환경 정보
      placeholder: |
        - 브라우저: Chrome 125
        - OS: macOS 14
        - 환경: 로컬 / 스테이지 / 프로덕션
